name: SBOM Drift

on:
  push:
  pull_request:

jobs:
  sbom-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Check SBOM artifact
        run: python scripts/build_sbom.py --check

