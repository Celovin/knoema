name: Deploy HF Space

on:
  push:
    branches: [main]
    paths:
      - "playground/**"

permissions:
  contents: read

concurrency:
  group: deploy-hf-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: playground/requirements.txt

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub

      - name: Upload playground to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="celovin/luvoire-playground",
              repo_type="space",
              folder_path="playground",
              path_in_repo=".",
              allow_patterns=[
                  "app.py",
                  "simulation.py",
                  "README.md",
                  "requirements.txt",
                  "hexaco_questionnaire.py",
                  "quest_generation.py",
                  "voice.py",
                  "player_input_parser.py",
                  "environments.yaml",
                  "persona_presets.yaml",
                  "scenarios/*.yaml",
                  "assets/**",
              ],
              commit_message=f"Auto-deploy from {os.environ['GITHUB_SHA']}",
          )
          PY
