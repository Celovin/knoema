name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache pytest state
        uses: actions/cache@v5
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pytest-${{ hashFiles('pyproject.toml', 'src/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pytest-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import smoke
        run: python -c "import luvoire; print(luvoire.__version__)"

      - name: CLI smoke
        run: |
          python -m luvoire.cli --help
          python -m luvoire.cli list-scenarios --json

      - name: API smoke
        run: python -c "from fastapi.testclient import TestClient; from luvoire.api.server import create_app; response = TestClient(create_app()).get('/healthz'); response.raise_for_status(); print(response.json())"

      - name: Cross-platform smoke tests
        run: pytest tests/test_version.py tests/test_phase1_types.py --no-cov -q

      - name: Linux wheel smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install build
          python -m build --wheel --outdir wheelhouse
          python -m pip install --force-reinstall --no-deps wheelhouse/luvoire_engine-*.whl
          python -c "import luvoire; print(luvoire.__version__)"
