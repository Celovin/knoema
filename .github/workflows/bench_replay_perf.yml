name: Replay Performance Benchmark

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo/replay/**"
      - "src/knoema/replay*"
      - "scripts/bench_replay_throughput.py"
      - "docs/benchmarks/replay-perf.json"
  pull_request:
    paths:
      - "demo/replay/**"
      - "src/knoema/replay*"
      - "scripts/bench_replay_throughput.py"

permissions:
  contents: read

jobs:
  replay-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check replay performance baseline
        run: python scripts/bench_replay_throughput.py --check

      - name: Upload replay benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: replay-perf-json
          path: docs/benchmarks/replay-perf.json
