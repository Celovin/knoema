name: Status Page

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-page-main
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install status dependencies
        run: python -m pip install "huggingface_hub>=0.24,<1.0"
      - name: Fetch status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/fetch_status.py
      - name: Append status history
        run: python scripts/build_status_page.py
      - name: Compute uptime
        run: python scripts/compute_uptime.py
      - name: Build status page
        run: python scripts/build_status_page.py --no-append
      - name: Commit updated status artifacts
        run: |
          if git diff --quiet -- site-snapshot/status.json site-snapshot/status.html site-snapshot/status-history.jsonl site-snapshot/uptime.json; then
            echo "status page is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-snapshot/status.json site-snapshot/status.html site-snapshot/status-history.jsonl site-snapshot/uptime.json
          git commit -m "chore(status): update status page"
          git push
