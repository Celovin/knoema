name: Scenario Hub

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scenario-hub.yml"
      - "scripts/validate_scenarios.py"
      - "scenarios_hub/**"
      - "src/knoema/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/scenario-hub.yml"
      - "scripts/validate_scenarios.py"
      - "scenarios_hub/**"
      - "src/knoema/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate scenario hub
        run: python scripts/validate_scenarios.py
