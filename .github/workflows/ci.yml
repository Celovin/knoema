name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-cache

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache pre-commit hooks
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pre-commit-cache
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Cache pytest state
        uses: actions/cache@v5
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('pyproject.toml', 'src/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,release]"

      - name: Warm pre-commit cache
        run: pre-commit install-hooks

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest --cov-fail-under=90

      - name: Release dry run
        run: python scripts/release_dry_run.py --version 0.1.1
