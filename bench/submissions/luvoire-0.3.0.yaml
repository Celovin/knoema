results:
  locomo:
    score: 1.0
    target: 0.8
    caveat: synthetic local proxy inspired by LoCoMo; not an official LoCoMo submission
    source: benchmarks/memory_benchmark_integration/results/summary.json#locomo
  memoryagentbench:
    score: 1.0
    target: 0.8
    caveat: synthetic EventQA and FactConsolidation proxy; not an official MemoryAgentBench
      submission
    source: benchmarks/memory_benchmark_integration/results/summary.json#memoryagentbench
  memoryarena:
    score: 1.0
    target: 0.6
    caveat: synthetic decision-relevant memory proxy over SQLite and FAISS retrieval;
      not an official MemoryArena submission
    source: benchmarks/memory_benchmark_integration/results/summary.json#memoryarena
  mlmf:
    score: 0.875
    target: 0.569
    caveat: deterministic synthetic long-horizon retention harness; target is the
      committed published-baseline field
    source: experiments/mlmf_retention_benchmark/results/summary.json
  theory_of_mind:
    score: 1.0
    target: 0.8
    caveat: symbolic Sally-Anne false-belief harness; demonstrates opt-in belief tracking,
      not human-level cognition
    source: experiments/theory_of_mind_ablation/results/summary.json
  htn:
    score: 0.905
    target: 0.85
    caveat: deterministic hierarchical-goal pursuit benchmark at depth 3 over 20 seeds
    source: experiments/planning_depth/results/summary.json#results.3
  realtime_latency:
    score: 1.0
    target: 1.0
    caveat: normalized from 5.941 ms replay-only tick latency against the 200 ms published
      ACE/Inworld envelope; not an audio pipeline measurement
    source: benchmarks/formal_report/results/latency_comparison.json#playground_replay
