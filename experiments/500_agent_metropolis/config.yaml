  location_path: ["Knoema Demo World", "Seoul Metropolis", "Transit Spine"]
  conditions:
    weather: clear
    rush_window: morning
    transit_pressure: high
districts:
  - Jongno
  - Mapo
  - Yongsan
  - Seongsu
  - Gangnam
  - Songpa
  - Yeouido
  - Euljiro
  - Hongdae
  - Digital Media City
roles:
  - dispatcher
  - platform steward
  - route analyst
  - emergency coordinator
  - logistics operator
  - station guide
  - energy monitor
  - fleet planner
  - maintenance lead
  - community liaison
actions:
  - commute
  - coordinate
  - handoff
  - assist
  - reroute
  - observe
latency_model:
  base_ms: 44.0
  tick_step_ms: 1.8
  district_step_ms: 0.9
  agent_step_ms: 0.4
  seed_step_ms: 0.7
