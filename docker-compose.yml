services:
  playground:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["luvoire", "playground", "--host", "0.0.0.0", "--port", "7860"]
    environment:
      GRADIO_ANALYTICS_ENABLED: "False"
      LUVOIRE_TELEMETRY_DISABLED: "1"
    ports:
      - "7860:7860"
    volumes:
      - ./runs:/app/runs
