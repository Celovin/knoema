site_name: Knoema Engine
site_description: Persistent-agent simulation engine documentation for games, synthetic replay research, and academic workflows.
site_url: https://knoema.celovin.com/docs/
repo_url: https://github.com/Celovin/knoema
repo_name: Celovin/knoema
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: green
    accent: lime

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

