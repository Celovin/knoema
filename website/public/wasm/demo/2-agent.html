<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luvoire 2-Agent Browser Demo</title>
  </head>
  <body>
    <main>
      <h1>2-Agent Dorm Demo</h1>
      <button id="run">Run 100 ticks</button>
      <pre id="result">Ready.</pre>
    </main>
    <script type="module">
      import { Environment, createDormAgents, runSimulation } from "./luvoire-core.js";

      document.querySelector("#run").addEventListener("click", () => {
        const result = runSimulation({
          personas: createDormAgents(2),
          environment: new Environment({ locationPath: ["Browser", "Dorm"] }),
          ticks: 100,
        });
        document.querySelector("#result").textContent = JSON.stringify(result, null, 2);
      });
    </script>
  </body>
</html>
