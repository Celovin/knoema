[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luvoire-engine"
version = "0.3.0"
description = "Luvoire: deterministic multi-agent simulation engine with replay, memory stack, and persona library."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Celovin", email = "hello@celovin.com" }]
keywords = [
    "luvoire",
    "llm",
    "multi-agent",
    "simulation",
    "agent-based-modeling",
    "npc",
    "generative-agents",
    "social-simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "anthropic>=0.34",
    "fastapi>=0.115",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "httpx>=0.28",
    "networkx>=3.3",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "loguru>=0.7",
    "msgpack>=1.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.5",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
mesa = [
    "mesa[rec]>=3.0,<4",
]
personas = [
    "datasets>=2.20,<4",
    "pyarrow>=16,<23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "duckdb>=1.5",
    # Gradio 6.0 split ``css`` / ``head`` to ``launch`` and reshaped a few
    # component kwargs. Tests + ops panel + main playground are
    # compatible with both 5.31+ and 6.x. Pinning to a major-range
    # avoids forcing 5.31.0 exactly while still rejecting an unforeseen
    # 7.x with breaking changes.
    "gradio>=5.31,<7",
    "huggingface_hub>=0.24,<1.0",
    "playwright>=1.58,<1.59",
    "plotly>=5.24",
    "pyarrow>=16,<23",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy>=1.14",
    "types-networkx>=3.5",
    "types-PyYAML>=6.0",
    "black>=24.8",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
    "httpx>=0.28",
    "jupyter>=1.1",
    "pypdf>=6.0",
    # Observability tests need the OTel SDK + FastAPI instrumentation;
    # without them the relevant 3 tests fail at collection-time. Pinning
    # here keeps a single ``pip install -e .[dev]`` invocation enough
    # to run the full test suite.
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]
api = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.32",
]
observability = [
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
    "prometheus-client>=0.20,<1.0",
]
dashboard = [
    "streamlit>=1.38",
    "plotly>=5.24",
    "pandas>=2.2",
]
paper = [
    "reportlab>=4.4",
    "pdfplumber>=0.11",
    "pypdf>=6.0",
]
research = [
    "statsmodels>=0.14",
    "pymc>=5.16",
    "arviz>=0.18",
]
geo = [
    "h3>=4.0",
    "shapely>=2.1",
    "geopandas>=1.0",
    "libpysal>=4.10",
    "osmnx>=2.0",
]
routing = [
    "routingpy>=1.3",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]
docs = [
    "mkdocs-material>=9.5,<9.8",
    "mkdocstrings[python]>=0.26",
]
analytics = [
    "duckdb>=1.5",
    "pyarrow>=16,<23",
]
security = [
    "bandit>=1.9",
    "pip-audit>=2.10",
    "safety>=3.7",
    "cyclonedx-bom>=7.3",
]
local-llm = [
    "transformers>=4.44",
    "torch>=2.4",
]
distributed = [
    "ray[default]>=2.40; python_version < '3.13'",
]
scale = [
    "ray[default]>=2.40; python_version < '3.13'",
]
mcp = []
bots = [
    "discord.py>=2.4",
    "slack-bolt>=1.20",
]

[project.urls]
Homepage = "https://github.com/Celovin/luvoire"
Repository = "https://github.com/Celovin/luvoire"
Issues = "https://github.com/Celovin/luvoire/issues"

[project.scripts]
luvoire = "luvoire.cli:main"
luvoire-verify = "luvoire.reproducibility:main"
luvoire-mcp = "luvoire_mcp.server:main"
luvoire-discord-bot = "luvoire_bots.discord:main"
luvoire-slack-bot = "luvoire_bots.slack:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/luvoire",
    "src/luvoire_mcp",
    "src/luvoire_bots",
    "src/knoema",
    "src/knoema_compat",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=luvoire --cov-report=term-missing"
markers = [
    "slow: opt-in tests that require live external services or large downloads",
    "hf_live: opt-in tests that require live Hugging Face dataset access",
]

[tool.coverage.run]
source = ["src/luvoire"]
omit = ["tests/*"]
