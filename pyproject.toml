[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knoema-engine"
version = "0.2.0"
description = "LLM-based multi-agent social simulation engine for games, public safety, and academic research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Celovin", email = "hello@celovin.com" }]
keywords = [
    "llm",
    "multi-agent",
    "simulation",
    "agent-based-modeling",
    "npc",
    "generative-agents",
    "social-simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "anthropic>=0.34",
    "fastapi>=0.115",
    "openai>=1.40",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "httpx>=0.28",
    "networkx>=3.3",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "loguru>=0.7",
    "msgpack>=1.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.5",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "gradio==5.31.0",
    "huggingface_hub>=0.24,<1.0",
    "playwright>=1.58,<1.59",
    "plotly>=5.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "scipy>=1.14",
    "types-networkx>=3.5",
    "types-PyYAML>=6.0",
    "black>=24.8",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
    "httpx>=0.28",
    "jupyter>=1.1",
    "pypdf>=6.0",
]
api = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.32",
]
dashboard = [
    "streamlit>=1.38",
    "plotly>=5.24",
    "pandas>=2.2",
]
paper = [
    "reportlab>=4.4",
    "pdfplumber>=0.11",
    "pypdf>=6.0",
]
research = [
    "statsmodels>=0.14",
    "pymc>=5.16",
    "arviz>=0.18",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]
docs = [
    "mkdocs-material>=9.5,<9.8",
    "mkdocstrings[python]>=0.26",
]
security = [
    "bandit>=1.9",
    "pip-audit>=2.10",
    "safety>=3.7",
    "cyclonedx-bom>=7.3",
]
local-llm = [
    "transformers>=4.44",
    "torch>=2.4",
]
distributed = [
    "ray[default]>=2.40; python_version < '3.13'",
]
scale = [
    "ray[default]>=2.40; python_version < '3.13'",
]
mcp = []
bots = [
    "discord.py>=2.4",
    "slack-bolt>=1.20",
]

[project.urls]
Homepage = "https://github.com/Celovin/knoema"
Repository = "https://github.com/Celovin/knoema"
Issues = "https://github.com/Celovin/knoema/issues"

[project.scripts]
knoema = "knoema.cli:main"
knoema-verify = "knoema.reproducibility:main"
knoema-mcp = "knoema_mcp.server:main"
knoema-discord-bot = "knoema_bots.discord:main"
knoema-slack-bot = "knoema_bots.slack:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knoema", "src/knoema_mcp", "src/knoema_bots"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=knoema --cov-report=term-missing"
markers = [
    "slow: opt-in tests that require live external services or large downloads",
]

[tool.coverage.run]
source = ["src/knoema"]
omit = ["tests/*"]
