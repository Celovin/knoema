AWSTemplateFormatVersion: "2010-09-09"
Description: Knoema API ECS Fargate stack with PostgreSQL and Redis placeholders.
Parameters:
  ContainerImage:
    Type: String
  DBPassword:
    Type: String
    NoEcho: true
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Knoema API security group
      VpcId: !Ref Vpc
  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref ApiSecurityGroup
  EcsCluster:
    Type: AWS::ECS::Cluster
  ApiTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: knoema-api
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ContainerDefinitions:
        - Name: api
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
  ApiService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsCluster
      DesiredCount: 2
      LaunchType: FARGATE
      TaskDefinition: !Ref ApiTask
  Postgres:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: knoema
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      MasterUsername: knoema
      MasterUserPassword: !Ref DBPassword
  Redis:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      Engine: redis
      CacheNodeType: cache.t4g.micro
      NumCacheNodes: 1
Outputs:
  LoadBalancerName:
    Value: !Ref ApiLoadBalancer
