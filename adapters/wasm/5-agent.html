<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knoema 5-Agent Browser Demo</title>
  </head>
  <body>
    <main>
      <h1>5-Agent Dorm Demo</h1>
      <button id="run">Run 100 ticks</button>
      <pre id="result">Ready.</pre>
    </main>
    <script type="module">
      import { Environment, createDormAgents, runSimulation } from "./knoema-core.js";

      document.querySelector("#run").addEventListener("click", () => {
        const result = runSimulation({
          personas: createDormAgents(5),
          environment: new Environment({ locationPath: ["Browser", "Dorm"] }),
          ticks: 100,
        });
        document.querySelector("#result").textContent = JSON.stringify(
          {
            agents: result.agents,
            ticks: result.ticks,
            actions: result.actions,
            elapsed_ms: result.elapsed_ms,
          },
          null,
          2,
        );
      });
    </script>
  </body>
</html>
