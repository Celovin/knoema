name: Community scenario lint

on:
  pull_request:
    paths:
      - "scenarios/**/*.yaml"
      - "manifest.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install luvoire-engine
      - run: luvoire validate scenarios --json
