<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relationship graph</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: relative;
    }

    #graph-root,
    #graph-root canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #graph-status {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(100, 116, 139, 0.35);
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      font-size: 14px;
      line-height: 1.4;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
    }

    body[data-theme="dark"] #graph-status {
      background: rgba(15, 23, 42, 0.82);
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div id="graph-root"></div>
  <div id="graph-status" hidden></div>
  <!-- KNOEMA_FORCE_GRAPH_BOOTSTRAP -->
  <script>
    (() => {
      const defaultCdnUrl =
        "https://cdn.jsdelivr.net/npm/3d-force-graph@1.79.0/dist/3d-force-graph.min.js";
      const boot = window.KNOEMA_FORCE_GRAPH_BOOT || {};
      const root = document.getElementById("graph-root");
      const status = document.getElementById("graph-status");
      let graph = null;
      let hoverLink = null;

      function resolvedTheme(theme) {
        return theme === "dark" ? "dark" : "light";
      }

      function palette(theme) {
        if (theme === "dark") {
          return {
            background: "#020617",
            text: "#e2e8f0",
            link: "rgba(148, 163, 184, 0.35)",
            linkHover: "#f8fafc",
            node: "#38bdf8",
            empty: "No relationship edges yet.",
          };
        }
        return {
          background: "#f8fafc",
          text: "#0f172a",
          link: "rgba(100, 116, 139, 0.34)",
          linkHover: "#0f172a",
          node: "#0f766e",
          empty: "No relationship edges yet.",
        };
      }

      function showStatus(message) {
        const text = String(message || "").trim();
        status.hidden = text.length === 0;
        status.textContent = text;
      }

      function threeNamespace() {
        return window.THREE || window.__THREE__;
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          if (!src) {
            reject(new Error("script src missing"));
            return;
          }
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(`failed to load ${src}`));
          document.head.appendChild(script);
        });
      }

      async function ensureLibrary() {
        if (window.ForceGraph3D) {
          return;
        }
        try {
          await loadScript(boot.cdnUrl || defaultCdnUrl);
        } catch (cdnError) {
          if (!boot.vendorUrl) {
            throw cdnError;
          }
          await loadScript(boot.vendorUrl);
        }
        if (!window.ForceGraph3D || !threeNamespace()) {
          throw new Error("3d-force-graph failed to initialize");
        }
      }

      function makeGlowSprite(color, diameter) {
        const THREE = threeNamespace();
        const canvas = document.createElement("canvas");
        canvas.width = 128;
        canvas.height = 128;
        const context = canvas.getContext("2d");
        const gradient = context.createRadialGradient(64, 64, 8, 64, 64, 56);
        gradient.addColorStop(0, "rgba(255,255,255,0.95)");
        gradient.addColorStop(0.28, color);
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        context.fillStyle = gradient;
        context.fillRect(0, 0, 128, 128);
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 0.74,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(diameter, diameter, 1);
        return sprite;
      }

      function makeTextSprite(text, color) {
        const THREE = threeNamespace();
        const safeText = String(text || "").trim() || "node";
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        context.font = "600 30px Inter, Segoe UI, Arial, sans-serif";
        const metrics = context.measureText(safeText);
        const width = Math.ceil(metrics.width + 28);
        const height = 52;
        canvas.width = width;
        canvas.height = height;
        const finalContext = canvas.getContext("2d");
        finalContext.font = "600 30px Inter, Segoe UI, Arial, sans-serif";
        finalContext.fillStyle = color;
        finalContext.textBaseline = "middle";
        finalContext.fillText(safeText, 14, height / 2);
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(width / 12, height / 12, 1);
        return sprite;
      }

      function nodeObject(node, colors) {
        const THREE = threeNamespace();
        const size = Number(node.size || 12);
        const color = node.color || colors.node;
        const radius = Math.max(3.8, size * 0.23);
        const group = new THREE.Group();
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 24, 24),
          new THREE.MeshPhongMaterial({
            color,
            emissive: color,
            emissiveIntensity: 0.32,
            shininess: 90,
            transparent: true,
            opacity: 0.95,
          }),
        );
        group.add(sphere);
        group.add(makeGlowSprite(color, radius * 6.6));
        if (node.showLabel) {
          const label = makeTextSprite(node.label || node.id, colors.text);
          label.position.set(0, radius * 4.1, 0);
          group.add(label);
        }
        return group;
      }

      function configureLights(colors) {
        const THREE = threeNamespace();
        const scene = graph.scene();
        let ambient = scene.getObjectByName("knoema-ambient-light");
        if (!ambient) {
          ambient = new THREE.AmbientLight(0xffffff, 0.95);
          ambient.name = "knoema-ambient-light";
          scene.add(ambient);
        }
        let key = scene.getObjectByName("knoema-key-light");
        if (!key) {
          key = new THREE.DirectionalLight(0xffffff, 0.9);
          key.name = "knoema-key-light";
          key.position.set(120, 120, 120);
          scene.add(key);
        }
        const fogColor = new THREE.Color(colors.background);
        scene.fog = new THREE.Fog(fogColor, 360, 760);
      }

      function resizeGraph() {
        if (!graph) {
          return;
        }
        graph.width(window.innerWidth);
        graph.height(window.innerHeight);
      }

      function renderGraph() {
        const theme = resolvedTheme(boot.theme);
        const colors = palette(theme);
        const graphData = boot.graphData || { nodes: [], links: [] };

        document.body.dataset.theme = theme;
        document.body.style.background = colors.background;
        root.style.background = colors.background;

        if (!Array.isArray(graphData.nodes) || graphData.nodes.length === 0) {
          showStatus(colors.empty);
          return;
        }

        if (!graph) {
          graph = window.ForceGraph3D({
            controlType: "orbit",
            rendererConfig: { antialias: true, alpha: true },
          })(root);
          graph.nodeThreeObjectExtend(true);
          graph.onLinkHover((link) => {
            hoverLink = link || null;
            graph.refresh();
          });
          graph.onNodeClick((node) => {
            node.showLabel = !node.showLabel;
            graph.refresh();
          });
          window.addEventListener("resize", resizeGraph);
        }

        graph.backgroundColor(colors.background);
        graph.width(window.innerWidth);
        graph.height(window.innerHeight);
        graph.graphData(graphData);
        graph.nodeVal((node) => Math.max(4, Number(node.size || 12)));
        graph.nodeLabel((node) => node.label || node.id || "");
        graph.nodeColor((node) => node.color || colors.node);
        graph.nodeThreeObject((node) => nodeObject(node, colors));
        graph.linkLabel((link) => link.label || "");
        graph.linkColor((link) => (hoverLink === link ? colors.linkHover : link.color || colors.link));
        graph.linkWidth((link) => {
          const baseWidth = Number(link.width || 1);
          return hoverLink === link ? Math.max(baseWidth * 1.85, 2.6) : baseWidth;
        });
        graph.linkDirectionalParticles((link) => (hoverLink === link ? 4 : 0));
        graph.linkDirectionalParticleWidth((link) => (hoverLink === link ? 2.8 : 0));
        graph.cooldownTicks(120);

        const chargeForce = graph.d3Force("charge");
        if (chargeForce && typeof chargeForce.strength === "function") {
          chargeForce.strength(-220);
        }
        const linkForce = graph.d3Force("link");
        if (linkForce && typeof linkForce.distance === "function") {
          linkForce.distance((link) => Number(link.distance || 92));
        }

        const controls = graph.controls();
        if (controls) {
          controls.enableDamping = true;
          controls.dampingFactor = 0.08;
          controls.minDistance = 90;
          controls.maxDistance = 900;
          controls.rotateSpeed = 0.72;
        }

        const renderer = graph.renderer();
        if (renderer) {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        }

        configureLights(colors);
        graph.onEngineStop(() => {
          if (!graph.__knoemaHasZoomed) {
            graph.zoomToFit(600, 64);
            graph.__knoemaHasZoomed = true;
          }
        });
        graph.refresh();
        showStatus("");
      }

      async function bootGraph() {
        try {
          await ensureLibrary();
          renderGraph();
        } catch (error) {
          showStatus(error instanceof Error ? error.message : "Relationship graph failed to load.");
        }
      }

      void bootGraph();
    })();
  </script>
</body>
</html>
