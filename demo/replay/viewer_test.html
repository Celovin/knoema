<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knoema Replay Viewer Self-Test</title>
  <style>
    body {
      margin: 0;
      font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
      background: #f6f8f4;
      color: #18211d;
    }
    main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }
    #result {
      padding: 12px 16px;
      border-bottom: 1px solid #cbd8ce;
      background: #fbfcf8;
      font-size: 14px;
    }
    iframe {
      width: 100%;
      height: 100%;
      min-height: 720px;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <div id="result">Running replay viewer self-test...</div>
    <iframe id="viewer" src="viewer.html" title="Replay viewer under test"></iframe>
  </main>
  <script>
    const expected = new Map([
      ["Criminology - Tier 1", 4],
      ["Criminology - Tier 2 Historical", 3],
      ["Personality - CAT-28 (Tier 5)", 8]
    ]);
    const result = document.getElementById("result");
    const iframe = document.getElementById("viewer");

    function assertViewerGroups(message) {
      const actual = new Map(message.groups.map((group) => [group.label, group.count]));
      for (const [label, count] of expected.entries()) {
        if (actual.get(label) !== count) {
          throw new Error(`${label} expected ${count}, got ${actual.get(label) || 0}`);
        }
      }
      if (message.total !== 15) throw new Error(`Expected 15 archetypes, got ${message.total}`);
      if (!message.hasSeparator) throw new Error("Missing visual separator option");
      result.textContent = "PASS: 15 archetypes grouped as 4 / 3 / 8.";
      result.dataset.status = "pass";
    }

    window.addEventListener("message", (event) => {
      if (event.data?.type !== "knoema-profile-groups") return;
      try {
        assertViewerGroups(event.data);
      } catch (error) {
        result.textContent = `FAIL: ${error.message}`;
        result.dataset.status = "fail";
      }
    });

    iframe.addEventListener("load", () => {
      setTimeout(() => {
        if (result.dataset.status) return;
        result.textContent = "FAIL: viewer did not publish profile groups";
        result.dataset.status = "fail";
      }, 3000);
    });
  </script>
</body>
</html>
