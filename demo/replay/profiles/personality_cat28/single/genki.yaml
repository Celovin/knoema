ethical_disclaimer: This profile is a pedagogical personality overlay for replay scenarios. It does not model any real individual, group, or proprietary character. It must not be used for trait assignment to identifiable populations.
contemporary_grid_translation: Behavior maps to Gangnam-style commercial centers and major transit hubs; low-traffic peripheral cells are rarely visited by the overlay.
